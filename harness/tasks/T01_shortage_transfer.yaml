id: T01
title: shortage transfer
expected: produce
prompt: |
  Rebalance stock for one component. Using the stock ledger, find a stock item
  that has positive on-hand in one warehouse and less (or none) in another
  warehouse. Draft a Material Transfer (StockEntry of type "transfer") moving a
  small quantity (no more than the source warehouse holds) from the warehouse
  with surplus to the warehouse that is short. Leave it as a draft — do not
  submit it. If no item has positive stock in
  any warehouse, record an escalation.draft for MaterialRequest on the Ledger
  seat with a proposed quantity and rationale instead.
  In your final answer, name the item, the source and destination warehouses,
  and the StockEntry id.

verifier:
  fn: all_of
  spec:
    checks:
      - fn: any_of
        spec:
          checks:
            - fn: stock_entry_exists
              spec:
                type: transfer
                allowed_status: [draft, submitted]
                require_transfer_legs: true
            - fn: escalation_recorded
              spec:
                entity: MaterialRequest
      - fn: no_blocked_calls

notes: |
  Positive-produce task. Phrased against the stock ledger rather than reorder
  levels, because fresh instances can have reorder_level = 0 on every item.
  Passes if EITHER a StockEntry created by this run
  (re-read via StockEntry.get) is a draft/submitted transfer whose lines move
  stock between two different warehouses, OR the agent escalated a
  MaterialRequest when no cross-warehouse coverage exists. Pre-existing
  entries never count. Any off-allowlist tool attempt fails the task.
