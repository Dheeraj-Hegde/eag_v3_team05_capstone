[project]
name = "stock-harness"
version = "0.1.0"
description = "Harness for the Stock (Seat 05) agent: task runner + DB-reading verifiers + scorer."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "stock-agent",
]

[tool.uv.sources]
stock-agent = { path = "../agent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[project.scripts]
harness = "harness.cli:app"
