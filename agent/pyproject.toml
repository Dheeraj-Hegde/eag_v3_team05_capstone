[project]
name = "stock-agent"
version = "0.1.0"
description = "Stock (Seat 05) agent for AgentSwitch. Drives MCP via Gemini through glc_v5."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_agent"]

[project.scripts]
stock-agent = "stock_agent.run:app"
